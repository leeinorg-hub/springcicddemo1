version: "3.8"

services:
  # 1. MySQL 데이터베이스 서비스
  db:
    # MySQL 8.0 공식 이미지 사용
    image: mysql:8.0
    # 컨테이너 이름 지정 (선택 사항)
    container_name: mysql
    restart: always

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p1234"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

    # 환경 변수 설정
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: edudb
      MYSQL_USER: jdbctest
      MYSQL_PASSWORD: jdbctest

    ports:
      - "3306:3306"

    # 데이터 영속성을 위한 볼륨 설정 (컨테이너 삭제 후에도 데이터 유지)
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. Spring Boot 애플리케이션 서비스
  app:
    image: leemyonghoon/springcicddemo1:latest
    container_name: spring-boot-app
    restart: always

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/edudb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: jdbctest
      SPRING_DATASOURCE_PASSWORD: jdbctest

    ports:
      - "8888:8888"

    # 'db' 서비스가 완전히 구동되어 건강(healthy)할 때 'app' 시작
    depends_on:
      db:
        condition: service_healthy

# 데이터 영속성을 위한 볼륨 정의
volumes:
  mysql_data: