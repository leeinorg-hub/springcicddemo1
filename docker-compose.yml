version: "3.8"

services:
  # 1. MySQL 데이터베이스 서비스
  db:
    # MySQL 8.0 공식 이미지 사용
    image: mysql:8.0
    # 컨테이너 이름 지정 (선택 사항)
    container_name: mysql
    restart: always

    # 💡 새로운 Health Check 섹션 추가
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s # 처음 10초 동안은 실패해도 무시

    # 환경 변수 설정
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: edudb
      MYSQL_USER: jdbctest
      MYSQL_PASSWORD: jdbctest

    ports:
      - "3307:3306"

    # 데이터 영속성을 위한 볼륨 설정 (컨테이너 삭제 후에도 데이터 유지)
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. Spring Boot 애플리케이션 서비스
  app:
    image: leemyonghoon/cicdtest1:latest
    container_name: spring-boot-app

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/edudb
      SPRING_DATASOURCE_USERNAME: jdbctest
      SPRING_DATASOURCE_PASSWORD: jdbctest

    ports:
      - "8088:8088"

    # 'db' 서비스가 완전히 실행된 후 'app' 서비스가 시작되도록 보장
    depends_on:
      db:
        condition: service_healthy

# 데이터 영속성을 위한 볼륨 정의
volumes:
  mysql_data: