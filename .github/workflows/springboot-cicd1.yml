name: Spring Boot Build and Docker Push to Hub and Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch: # GitHub 웹 Actions 탭에서 수동으로 'Run workflow' 버튼으로 실행 가능하도록 추가

env:
  # Docker Hub 계정 정보
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'leemyonghoon' }}
  # 최종 도커 이미지 이름 (프로젝트명과 일치)
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'leemyonghoon' }}/springcicddemo1
  # Spring Boot 프로젝트의 JAR 파일 이름 (Dockerfile의 ARG와 일치)
  JAR_NAME: springcicddemo1.jar
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}
  DEPLOY_PATH: /home/${{ secrets.EC2_USER }}/app
  DOCKER_COMPOSE_FILE: docker-compose.yml # 로컬 프로젝트 루트에 있는 파일명

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 리포지토리 코드 체크아웃 (Actions V4 사용)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. JDK 21 설정 (Dockerfile의 openjdk에 맞춰 distribution 변경)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin' # Dockerfile의 eclipse-temurin 이미지와 일치
          cache: 'gradle'

      # 3. Gradle Wrapper 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Spring Boot 프로젝트 빌드 (테스트 제외)
      - name: Build and Test with Gradle
        run: ./gradlew clean build -x test

      # 5. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_PASSWORD || secrets.DOCKER_TOKEN }}

      # 6. Docker 이미지의 태그 설정 및 Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,enable=true # 커밋 SHA 기반 태그
            type=raw,value=latest # latest 태그

      # 7. Docker 이미지 빌드 및 Docker Hub에 푸시
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JAR_FILE=build/libs/${{ env.JAR_NAME }}
  ###################################################
  # 8. EC2 서버 자동 배포 Job 추가 (CD)
  ###################################################
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # 8.1. 파일 전송 전, 코드를 체크아웃하여 docker-compose.yml 파일을 준비합니다.
      - name: Checkout Code for SCP
        uses: actions/checkout@v4

      # 8.2. docker-compose.yml 파일을 EC2 서버로 안전하게 전송 (Secure Copy)
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7 # SCP 액션 사용
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ${{ env.DOCKER_COMPOSE_FILE }} # 전송할 파일
          target: ${{ env.DEPLOY_PATH }} # EC2 서버의 대상 경로 (디렉토리)
          # 대상 디렉토리가 없다면 생성합니다.
          strip_components: 0 # 파일 이름 그대로 전송

      # 8.3. SSH를 통해 EC2 서버에 접속하고 배포 명령 실행
      - name: Deploy to EC2 with SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_NAME # 필요한 환경 변수 추가

          # 8.4 EC2에서 실행할 명령 (Remote Commands)
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.docker/cli-plugins
            
            # 1. EC2에 Docker가 설치되어 있지 않은 경우 자동 설치
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing Docker on EC2..."
              if command -v dnf &> /dev/null; then
                sudo dnf update -y
                sudo dnf install -y docker
              elif command -v yum &> /dev/null; then
                sudo yum update -y
                sudo yum install -y docker
              elif command -v apt-get &> /dev/null; then
                sudo apt-get update -y
                sudo apt-get install -y docker.io
              fi
            fi

            # Docker 데몬 시작 및 권한 부여
            sudo systemctl enable --now docker
            sudo usermod -aG docker ${{ env.EC2_USER }} || true
            sudo chmod 666 /var/run/docker.sock || true

            # 2. Docker Compose가 설치되어 있지 않은 경우 자동 설치
            if ! sudo docker compose version > /dev/null 2>&1 && ! command -v docker-compose &> /dev/null; then
              echo "Docker Compose not found. Installing Docker Compose on EC2..."
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m) -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              sudo ln -sf /usr/local/lib/docker/cli-plugins/docker-compose /usr/bin/docker-compose || true
              sudo ln -sf /usr/local/lib/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose || true
            fi

            # 3. 배포 경로로 이동
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}   
            
            # 4. Docker Compose 명령어 자동 판별 (sudo 적용)
            if sudo docker compose version > /dev/null 2>&1; then
              COMPOSE_CMD="sudo docker compose"
            else
              COMPOSE_CMD="sudo docker-compose"
            fi
            echo "Using compose command: $COMPOSE_CMD"
            
            # 5. Docker Hub 로그인
            echo "Logging in to Docker Hub..."
            sudo docker login -u ${{ env.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_PASSWORD || secrets.DOCKER_TOKEN }}
            
            # 6. 최신 이미지 Pull 및 컨테이너 재시작
            echo "Pulling latest image and restarting containers..."
            $COMPOSE_CMD down || true
            sudo docker rmi ${{ env.IMAGE_NAME }}:latest || true
            $COMPOSE_CMD pull
            $COMPOSE_CMD up -d --force-recreate
            
            # 7. 기동 대기 및 로그 확인
            echo "Waiting for Spring Boot to start..."
            sleep 20
            $COMPOSE_CMD ps
            echo "=== Spring Boot Container Logs ==="
            $COMPOSE_CMD logs --tail=50 app
            
            echo "Deployment to EC2 complete!"